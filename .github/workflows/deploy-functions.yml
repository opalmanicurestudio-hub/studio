# .github/workflows/deploy-functions.yml  (v2 — runtime env included)
#
# Deploys Cloud Functions automatically whenever anything under functions/
# changes on main. No terminal needed on any device.
#
# REQUIRED GITHUB SECRETS (repo → Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT   entire JSON from Firebase console →
#                              Project settings → Service accounts →
#                              Generate new private key
#   FIREBASE_PROJECT_ID        your Firebase project id
#   RESEND_API_KEY             from resend.com → API Keys
#   RESEND_SENDING_DOMAIN      the domain shown as VERIFIED in
#                              resend.com → Domains (e.g. yourdomain.com)
#   APP_BASE_URL               optional — your live app URL, e.g.
#                              https://studio-one-blue.vercel.app
#
# WHY THE .env STEP EXISTS: 2nd-gen Cloud Functions do not inherit env
# vars by themselves. Without this file, RESEND_API_KEY is undefined at
# runtime and every email fails AFTER a perfectly green deploy. The file
# is generated fresh in the runner from secrets — it never touches git.

name: Deploy Cloud Functions

on:
  push:
    branches: [main, master]
    paths:
      - 'functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install function dependencies
        working-directory: functions
        run: npm ci || npm install

      - name: Write runtime environment for functions
        working-directory: functions
        run: |
          {
            echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}"
            echo "RESEND_SENDING_DOMAIN=${{ secrets.RESEND_SENDING_DOMAIN }}"
            echo "APP_BASE_URL=${{ secrets.APP_BASE_URL }}"
          } > .env

      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"

      - name: Deploy functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          npx firebase-tools deploy --only functions \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}" \
            --non-interactive --force
